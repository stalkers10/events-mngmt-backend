services:
  postgres:
    image: postgres:16-alpine
    container_name: elite-events-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elite_events
      POSTGRES_PASSWORD: elite_events_dev_password
      POSTGRES_DB: elite_events
    ports:
      - "5433:5432"
    volumes:
      - elite_events_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite_events -d elite_events"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  elite_events_pgdata:
