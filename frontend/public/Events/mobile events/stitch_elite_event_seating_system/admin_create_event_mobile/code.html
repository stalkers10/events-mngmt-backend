<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Create Event - Burgundy &amp; Peach</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            -webkit-tap-highlight-color: transparent;

            background: rgba(255, 248, 247, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<script id="tailwind-config">

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container": "#ffe9e8",
                      "error-container": "#ffdad6",
                      "surface-container-low": "#fff0f0",
                      "on-primary-fixed": "#40000b",
                      "on-background": "#251819",
                      "surface-container-high": "#fbe2e2",
                      "inverse-primary": "#ffb3b5",
                      "primary-fixed-dim": "#ffb3b5",
                      "on-surface-variant": "#584141",
                      "on-error-container": "#93000a",
                      "on-tertiary-fixed": "#001f26",
                      "surface-bright": "#fff8f7",
                      "outline": "#8c7071",
                      "on-secondary-fixed-variant": "#53433f",
                      "surface-container-lowest": "#ffffff",
                      "inverse-on-surface": "#ffedec",
                      "surface-variant": "#f5dddd",
                      "on-error": "#ffffff",
                      "primary": "#570013",
                      "on-primary": "#ffffff",
                      "tertiary": "#002c36",
                      "error": "#ba1a1a",
                      "surface": "#fff8f7",
                      "on-tertiary-container": "#7cb0c0",
                      "on-tertiary-fixed-variant": "#114d5b",
                      "surface-tint": "#af2b3e",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#8e0f28",
                      "on-primary-container": "#ff828a",
                      "inverse-surface": "#3b2d2d",
                      "tertiary-fixed": "#b6ebfb",
                      "surface-container-highest": "#f5dddd",
                      "tertiary-fixed-dim": "#9acfde",
                      "outline-variant": "#e0bfbf",
                      "on-secondary-container": "#72605c",
                      "on-secondary": "#ffffff",
                      "background": "#fff8f7",
                      "secondary-fixed": "#f5ddd7",
                      "tertiary-container": "#004451",
                      "on-surface": "#251819",
                      "surface-dim": "#edd4d4",
                      "secondary": "#6c5b56",
                      "primary-container": "#800020",
                      "primary-fixed": "#ffdada",
                      "on-secondary-fixed": "#251915",
                      "secondary-fixed-dim": "#d8c2bc",
                      "secondary-container": "#f5ddd7"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-margin-mobile": "16px",
                      "xs": "4px",
                      "md": "16px",
                      "lg": "24px",
                      "max-width-desktop": "1200px",
                      "container-margin-desktop": "auto",
                      "sm": "8px",
                      "xl": "32px",
                      "base": "4px"
              },
              "fontFamily": {
                      "headline-sm": ["Inter"],
                      "display-lg": ["Inter"],

                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

                      "display-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700"}],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen">
<!-- Top App Bar (Header) -->
<header class="sticky top-0 z-50 glass-effect flex justify-between items-center px-lg py-md w-full max-w-max-width-desktop mx-auto bg-surface/80">
<div class="flex items-center gap-sm">
<button class="flex items-center justify-center p-2 rounded-full active:scale-90 transition-transform">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary">Create Event</h1>
</div>
<div class="flex gap-md">
<span class="material-symbols-outlined text-primary">help</span>
</div>
</header>
<main class="px-container-margin-mobile py-lg max-w-md mx-auto space-y-xl pb-32">
<!-- Hero Decorative Section -->
<div class="relative w-full h-48 rounded-xl overflow-hidden shadow-[0px_4px_20px_rgba(128,0,32,0.04)] mb-lg">
<img class="w-full h-full object-cover" data-alt="A luxurious high-end event space with high ceilings and sophisticated architecture. The scene is illuminated by soft, warm evening light filtering through large windows. The interior design features a palette of soft peach and deep burgundy, with elegant floral arrangements and premium furniture, evoking a sense of high-end hospitality and meticulous organization." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjddPxtEk7V3cB-dSaqNmxr4L5021kjXsJ6RUqGQbOosgzI_cVU_-SH_D8_2MBs-AaRFn5Fti-Z9s9TxY1awix7cNA2d8BeNzvxwJiqpsruiInMzbbESnZx9wNOrT74hoBMYJ6MfKsUMPFyPG7YZY7BHJK5OA6am6iUxGRxKcdPpnRC3A0SO5F6vyHb0CpTkaBtTG0pnY1dEQOEr-n_3otSjbd8XtBKPd1_jxgfmF7uTrqx_Q8rdPfvd2GEtszm-btqoua0ElhskmK">
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
<div class="absolute bottom-md left-md">
<span class="font-label-caps text-label-caps text-white bg-primary-container px-2 py-1 rounded-full uppercase">Draft Mode</span>
</div>
</div>
<section class="space-y-lg">
<!-- Event Name -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Event Name</label>
<div class="group">
<input class="w-full bg-white border-outline-variant border rounded-lg px-md py-3 font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-150 shadow-sm" placeholder="e.g. Victorian Autumn Gala" type="text">
</div>
</div>
<!-- Room Selection -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Room Selection</label>
<div class="relative">
<select class="w-full bg-white border-outline-variant border rounded-lg px-md py-3 font-body-lg text-on-surface appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-150 shadow-sm pr-10">
<option disabled="" selected="" value="">Select a venue room...</option>
<option>The Grand Ballroom</option>
<option>Peach Orchard Conservatory</option>
<option>Burgundy Wine Cellar</option>
<option>Skyline Rooftop</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Date & Time Row -->
<div class="grid grid-cols-1 gap-lg">
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Start Date &amp; Time</label>
<div class="flex gap-sm">
<input class="flex-1 bg-white border-outline-variant border rounded-lg px-md py-3 font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" type="date">
<input class="w-32 bg-white border-outline-variant border rounded-lg px-md py-3 font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" type="time">
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">End Date &amp; Time</label>
<div class="flex gap-sm">
<input class="flex-1 bg-white border-outline-variant border rounded-lg px-md py-3 font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" type="date">
<input class="w-32 bg-white border-outline-variant border rounded-lg px-md py-3 font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" type="time">
</div>
</div>
</div>
<!-- Conflict Warning Message -->
<div class="bg-error-container border border-error/20 p-md rounded-xl flex gap-md items-start animate-pulse" id="conflict-warning">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
<div class="space-y-1">
<p class="font-label-caps text-label-caps text-error font-bold uppercase">Schedule Conflict Detected</p>
<p class="font-body-sm text-body-sm text-on-error-container">The "Grand Ballroom" is already booked for the "Annual Heritage Dinner" during this time slot. Please choose another room or time.</p>
</div>
</div>
<!-- Additional Detail/Note (Optional Polish) -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Internal Notes</label>
<textarea class="w-full bg-white border-outline-variant border rounded-lg px-md py-3 font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" placeholder="Add any specific requirements for this event..." rows="3"></textarea>
</div>
</section>
</main>
<!-- Bottom Action Sheet (Floating) -->
<div class="fixed bottom-0 left-0 right-0 p-md glass-effect z-50">
<div class="max-w-md mx-auto flex flex-col gap-sm">
<button class="w-full bg-primary-container text-white py-4 rounded-xl font-button text-button shadow-lg active:scale-[0.98] transition-transform duration-150 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
                Create Event
            </button>
<button class="w-full bg-surface-container-high text-primary py-4 rounded-xl font-button text-button active:scale-[0.98] transition-transform duration-150">
                Cancel
            </button>
</div>
</div>
<!-- Background Subtle Micro-Animation -->
<div class="fixed inset-0 pointer-events-none -z-10 opacity-30">

</div>
<script>
        // Simple micro-interaction for the warning
        const warning = document.getElementById('conflict-warning');
        let visible = true;
        
        // Simulate real-time validation feedback loop
        setInterval(() => {
            if(Math.random() > 0.8) {
                warning.style.opacity = '0.7';
                setTimeout(() => warning.style.opacity = '1', 150);
            }
        }, 3000);

        // Form focus effect logic
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('div').classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('div').classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
