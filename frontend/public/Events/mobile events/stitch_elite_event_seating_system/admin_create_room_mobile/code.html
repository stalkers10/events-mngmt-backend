<script>
        function increment(id) {
            const input = document.getElementById(id + '-input');
            input.value = parseInt(input.value) + 1;
        }
        
        function decrement(id) {
            const input = document.getElementById(id + '-input');
            if (parseInt(input.value) > 0) {
                input.value = parseInt(input.value) - 1;
            }
        }

        function generateLayout() {
            const tables = parseInt(document.getElementById('tables-input').value);
            const chairs = parseInt(document.getElementById('chairs-input').value);
            const container = document.getElementById('layout-container');
            
            // Visual feedback
            container.style.opacity = '0';
            
            setTimeout(() => {
                container.innerHTML = '';
                const displayCount = Math.min(tables, 12); // Limit visual for performance/mobile
                
                for (let i = 0; i < displayCount; i++) {
                    const tableEl = document.createElement('div');
                    tableEl.className = 'flex flex-col items-center gap-xs transform scale-0 transition-transform duration-500 delay-[' + (i * 50) + 'ms]';
                    tableEl.innerHTML = `
                        <div class="w-10 h-10 rounded-full border-2 border-primary-container bg-white flex items-center justify-center shadow-sm">
                            <span class="text-[10px] font-bold text-primary">${chairs}</span>
                        </div>
                    `;
                    container.appendChild(tableEl);
                    
                    // Trigger animation
                    requestAnimationFrame(() => {
                        tableEl.style.transform = 'scale(1)';
                    });
                }
                
                if (tables > 12) {
                     const moreEl = document.createElement('div');
                     moreEl.className = 'flex items-center justify-center';
                     moreEl.innerHTML = `<span class="text-xs text-outline font-label-caps">+${tables - 12} more</span>`;
                     container.appendChild(moreEl);
                }
                
                container.style.opacity = '1';
                container.classList.add('transition-opacity', 'duration-300');
            }, 300);
        }

        // Initialize with default values
        window.onload = generateLayout;
    </script>
