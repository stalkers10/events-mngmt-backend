<style>
        body {
            background-color: #FFF1EE;
            font-family: 'Inter', sans-serif;

    body {

<body class="flex flex-col min-h-screen">
<main class="flex-grow flex flex-col items-center justify-center px-container-margin-mobile py-xl">
<!-- Brand Identity Section -->
<div class="w-full max-w-[400px] flex flex-col items-center mb-xl text-center">
<div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center mb-lg soft-shadow border-4 border-surface">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" data-icon="restaurant_menu">restaurant_menu</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-xs">
                Burgundy &amp; Peach
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Sign in to manage your events
            </p>
</div>
<!-- Login Form Card -->
<div class="w-full max-w-[400px] bg-surface-container-lowest p-lg rounded-xl soft-shadow border border-outline-variant/30">
<form class="space-y-lg" id="loginForm" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="username">USERNAME</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-11 pr-md py-md bg-surface border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-outline-variant transition-all" id="username" placeholder="e.g. event_manager_01" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">PASSWORD</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-11 pr-11 py-md bg-surface border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-outline-variant transition-all" id="password" placeholder="••••••••" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-xs cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary-container focus:ring-primary-container" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-primary transition-colors">Remember me</span>
</label>
<a class="font-body-sm text-body-sm font-semibold text-primary-container hover:underline decoration-primary-container/30 underline-offset-4" href="#">
                        Forgot password?
                    </a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-button text-button py-md rounded-lg shadow-sm active:scale-[0.98] transition-transform duration-150 flex items-center justify-center gap-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
</form>
<!-- Secondary Action -->
<div class="mt-xl pt-lg border-t border-outline-variant/30 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary-container font-semibold hover:underline underline-offset-4" href="#">Contact HR</a>
</p>
</div>
</div>
<!-- Atmospheric Footer (Optional for high-end feel) -->
<div class="mt-xl flex items-center gap-md opacity-40 grayscale">
<span class="material-symbols-outlined" data-icon="verified_user">verified_user</span>
<span class="font-label-caps text-label-caps">Secure Event Management System</span>
</div>
</main>
<!-- Decorative Corner Background Image (Abstract Corporate) -->
<div class="fixed -bottom-20 -right-20 w-64 h-64 opacity-5 pointer-events-none">
<img class="w-full h-full object-contain" data-alt="A sophisticated abstract background featuring soft-focused floral arrangements in deep burgundy and pale peach tones. The lighting is warm and ethereal, suggesting an upscale gala atmosphere. The composition is minimal and elegant, perfectly matching a modern corporate aesthetic with a hospitality touch." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmuCoQY3hteNJI957V2AH3pz33JVe9_9qjp194xZM3SJT-2pI5LUv3IzjBRDLK25pB5JlIP_OFC_53ZSGwMtmbrqiAQn60dtA2yvkTziukE5xewDyRLq1RmbGG1YwQVQpLmOHnsPddKvKrJWWfRTh7gwyE9PsupPazxAWqEXJCuuBx0yq1qHM_wF-qGqS4a2wIaAtrCwdh4N5GihP9SimYOPqvFLaSc5msjVXuEoO-47ABmdt2CK2I5ENc5npPkHkg-tEBSQEwIWjB">
</div>
<script>
        // Micro-interaction for the sign-in button
        document.querySelector('button[type="submit"]').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Authenticating...';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.classList.remove('opacity-80');
                // Normally redirection logic here
            }, 1500);
        });

        // Password visibility toggle
        const togglePass = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        togglePass.addEventListener('click', () => {
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            const icon = togglePass.querySelector('.material-symbols-outlined');
            icon.innerText = type === 'password' ? 'visibility' : 'visibility_off';
        });
    </script>
</body></html>
