<style>
        body {
            background-color: theme('colors.background');
        }
        .scanner-frame {
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            clip-path: polygon(0% 0%, 0% 100%, 20px 100%, 20px 20px, calc(100% - 20px) 20px, calc(100% - 20px) calc(100% - 20px), 20px calc(100% - 20px), 20px 100%, 100% 100%, 100% 0%);
        }
        .scanner-corner {
            width: 32px;
            height: 32px;
            border-color: theme('colors.primary');
            border-style: solid;
            position: absolute;
        }
        .tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-radius: 8px 0 0 0; }
        .tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-radius: 0 8px 0 0; }
        .bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-radius: 0 0 0 8px; }
        .br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-radius: 0 0 8px 0; }
        
        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }
        .scan-line {
            animation: scanline 2s linear infinite;
        }
