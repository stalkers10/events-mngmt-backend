<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - Burgundy &amp; Peach</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#114d5b",
                        "on-surface-variant": "#584141",
                        "surface-container-high": "#fbe2e2",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#b6ebfb",
                        "on-tertiary-container": "#7cb0c0",
                        "on-surface": "#251819",
                        "primary-fixed": "#ffdada",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#d8c2bc",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#f5ddd7",
                        "secondary": "#6c5b56",
                        "surface-tint": "#af2b3e",
                        "inverse-primary": "#ffb3b5",
                        "background": "#fff8f7",
                        "secondary-container": "#f5ddd7",
                        "primary-container": "#800020",
                        "surface-container-highest": "#f5dddd",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#ffb3b5",
                        "primary": "#570013",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#72605c",
                        "tertiary-container": "#004451",
                        "surface": "#fff8f7",
                        "surface-dim": "#edd4d4",
                        "on-tertiary-fixed": "#001f26",
                        "inverse-surface": "#3b2d2d",
                        "tertiary": "#002c36",
                        "on-error-container": "#93000a",
                        "surface-container": "#ffe9e8",
                        "on-primary-fixed": "#40000b",
                        "on-background": "#251819",
                        "inverse-on-surface": "#ffedec",
                        "outline-variant": "#e0bfbf",
                        "surface-container-low": "#fff0f0",
                        "surface-bright": "#fff8f7",
                        "on-secondary-fixed-variant": "#53433f",
                        "on-primary-fixed-variant": "#8e0f28",
                        "on-secondary-fixed": "#251915",
                        "surface-variant": "#f5dddd",
                        "tertiary-fixed-dim": "#9acfde",
                        "on-primary-container": "#ff828a",
                        "on-primary": "#ffffff",
                        "outline": "#8c7071"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "sm": "8px",
                        "container-margin-desktop": "auto",
                        "xl": "32px",
                        "max-width-desktop": "1200px",
                        "base": "4px",
                        "container-margin-mobile": "16px",
                        "lg": "24px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "button": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "button": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .ambient-shadow {
            box-shadow: 0px 4px 20px rgba(128, 0, 32, 0.04);
        }
        .ambient-shadow-hover:hover {
            box-shadow: 0px 8px 24px rgba(128, 0, 32, 0.08);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-md md:p-lg antialiased text-on-surface">
<!-- Main Container -->
<main class="w-full max-w-md mx-auto">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl ambient-shadow p-lg md:p-xl flex flex-col gap-xl">
<!-- Branding Header -->
<div class="text-center flex flex-col items-center gap-sm">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center text-on-primary-container mb-2">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">
                        event_seat
                    </span>
</div>
<h1 class="font-headline-md text-headline-md text-primary">Burgundy &amp; Peach</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to manage your events</p>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<div class="flex flex-col gap-md">
<!-- Username Input -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-caps text-label-caps text-on-surface-variant pl-1" for="username">Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant z-10 pointer-events-none">
                                person
                            </span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:border-2 focus:ring-0 transition-all placeholder:text-on-surface-variant/50" id="username" name="username" placeholder="Enter your username" required="" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-caps text-label-caps text-on-surface-variant pl-1" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant z-10 pointer-events-none">
                                lock
                            </span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:border-2 focus:ring-0 transition-all placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="Enter your password" required="" type="password">
</div>
</div>
<!-- Form Actions (Remember me / Forgot password) -->
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest accent-primary" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember me</span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary-container font-button text-button py-3 px-6 rounded-lg ambient-shadow-hover transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.98]" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-sm">
                        arrow_forward
                    </span>
</button>
</form>
<!-- Footer Links -->
<div class="text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Need assistance? <a class="text-primary hover:underline" href="#">Contact Support</a>
</p>
</div>
</div>
</main>
</body></html>
