                    "on-tertiary": "#ffffff",
                    "on-secondary-container": "#72605c",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom subtle peach background matching the prompt */
        body {
            background-color: #FFF1EE;
        }
        /* Hide number input spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .otp-box:focus {
            border-color: #800020;
            box-shadow: 0 0 0 2px rgba(128, 0, 32, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-md">
<!-- Verification Card Canvas -->
<main class="w-full max-w-lg animate-in fade-in zoom-in duration-500">
<!-- Branding Logo / Header (Suppressed Nav Shell as per Transactional rule) -->
<div class="flex flex-col items-center mb-xl">
<div class="mb-md">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    verified_user
                </span>
</div>
<h2 class="font-headline-md text-headline-md text-primary-container tracking-tight">Burgundy &amp; Peach</h2>
</div>
<!-- OTP Card -->
<div class="bg-surface-container-lowest rounded-xl p-xl shadow-[0px_4px_20px_rgba(128,0,32,0.04)] border border-outline-variant/30">
<div class="text-center mb-lg">
<h1 class="font-headline-sm text-headline-sm text-primary-container mb-xs">Verify Your Identity</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter the 8-character code sent to your email</p>
</div>
<!-- OTP Input Group -->
<form class="space-y-lg" id="otp-form">
<div class="flex justify-between gap-xs sm:gap-sm" id="otp-container">
<!-- 8 Inputs for Alphanumeric Code -->
<input class="otp-box w-full aspect-square text-center font-headline-sm text-headline-sm rounded-lg border-outline-variant bg-surface-container-low focus:ring-0 focus:border-primary-container uppercase transition-all" maxlength="1" required="" type="text">
<input class="otp-box w-full aspect-square text-center font-headline-sm text-headline-sm rounded-lg border-outline-variant bg-surface-container-low focus:ring-0 focus:border-primary-container uppercase transition-all" maxlength="1" required="" type="text">
<input class="otp-box w-full aspect-square text-center font-headline-sm text-headline-sm rounded-lg border-outline-variant bg-surface-container-low focus:ring-0 focus:border-primary-container uppercase transition-all" maxlength="1" required="" type="text">
<input class="otp-box w-full aspect-square text-center font-headline-sm text-headline-sm rounded-lg border-outline-variant bg-surface-container-low focus:ring-0 focus:border-primary-container uppercase transition-all" maxlength="1" required="" type="text">
<input class="otp-box w-full aspect-square text-center font-headline-sm text-headline-sm rounded-lg border-outline-variant bg-surface-container-low focus:ring-0 focus:border-primary-container uppercase transition-all" maxlength="1" required="" type="text">
<input class="otp-box w-full aspect-square text-center font-headline-sm text-headline-sm rounded-lg border-outline-variant bg-surface-container-low focus:ring-0 focus:border-primary-container uppercase transition-all" maxlength="1" required="" type="text">
<input class="otp-box w-full aspect-square text-center font-headline-sm text-headline-sm rounded-lg border-outline-variant bg-surface-container-low focus:ring-0 focus:border-primary-container uppercase transition-all" maxlength="1" required="" type="text">
<input class="otp-box w-full aspect-square text-center font-headline-sm text-headline-sm rounded-lg border-outline-variant bg-surface-container-low focus:ring-0 focus:border-primary-container uppercase transition-all" maxlength="1" required="" type="text">
</div>
<!-- Error State Example -->
<div class="flex items-center gap-xs text-error animate-pulse">
<span class="material-symbols-outlined text-[16px]">error</span>
<span class="font-label-caps text-label-caps">Invalid or expired code</span>
</div>
<!-- Action Button -->
<button class="w-full py-md bg-primary-container text-on-primary rounded-lg font-button text-button shadow-md hover:opacity-90 active:scale-[0.98] transition-all duration-150 flex justify-center items-center gap-sm" type="submit">
                    Verify
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer / Resend Logic -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-xs">
                    Didn't receive the code? 
                    <span class="text-outline font-semibold" id="countdown-text">Resend in 24s</span>
</p>
<div class="mt-lg pt-lg border-t border-outline-variant/30">
<a class="font-label-caps text-label-caps text-secondary hover:text-primary transition-colors inline-flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[14px]">support_agent</span>
                        Contact Support
                    </a>
</div>
</div>
</div>
<!-- Decorative Elements -->
<div class="mt-lg text-center opacity-40">
<p class="font-label-caps text-label-caps text-on-surface">Secure Multi-Factor Authentication</p>
</div>
</main>
<script>
        // Micro-interactions for the OTP inputs
        const inputs = document.querySelectorAll('.otp-box');
        
        inputs.forEach((input, index) => {
            // Handle typing
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            // Handle backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').slice(0, 8).split('');
                pasteData.forEach((char, i) => {
                    if (inputs[i]) {
                        inputs[i].value = char.toUpperCase();
                    }
                });
                if (pasteData.length > 0) {
                    inputs[Math.min(pasteData.length, inputs.length - 1)].focus();
                }
            });
        });

        // Simple Countdown Simulation
        let timeLeft = 24;
        const countdownElement = document.getElementById('countdown-text');
        
        const timer = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                countdownElement.innerText = `Resend in ${timeLeft}s`;
            } else {
                clearInterval(timer);
                countdownElement.innerHTML = `<button class="text-primary-container font-bold hover:underline">Resend Now</button>`;
            }
        }, 1000);

        // Form Submit Interaction
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Verifying...`;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                alert('In a real app, this would verify the code.');
            }, 1500);
        });
    </script>
</body></html>
