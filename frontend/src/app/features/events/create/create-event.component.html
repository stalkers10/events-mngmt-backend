<div class="create-draft-page">
  <div class="create-draft-card card">

    <div class="create-draft-header">
      <div class="header-icon">
        <span class="material-symbols-outlined">event_note</span>
      </div>
      <h1>{{ 'events.newEvent' | translate }}</h1>
      <p class="subtitle">{{ 'events.newEventSubtitle' | translate }}</p>
    </div>

    <div class="create-draft-body">
      <div class="form-field">
        <label for="event-name">{{ 'events.name' | translate }}</label>
        <input
          id="event-name"
          type="text"
          [(ngModel)]="eventName"
          [placeholder]="'events.namePlaceholder' | translate"
          [class.field-invalid]="submitted() && !eventName().trim()"
          (keydown.enter)="submit()"
          autofocus
        />
        @if (submitted() && !eventName().trim()) {
          <p class="invalid-feedback">{{ 'events.nameRequired' | translate }}</p>
        }
      </div>

      <p class="draft-hint">
        <span class="material-symbols-outlined">info</span>
        {{ 'events.draftHint' | translate }}
      </p>
    </div>

    <div class="create-draft-footer">
      <a [routerLink]="['/events']" class="btn btn-secondary">
        {{ 'common.cancel' | translate }}
      </a>
      <button
        type="button"
        class="btn btn-primary"
        (click)="submit()"
        [disabled]="isSubmitting()"
      >
        @if (isSubmitting()) {
          <span class="material-symbols-outlined spin">progress_activity</span>
        } @else {
          <span class="material-symbols-outlined">save</span>
        }
        {{ 'events.saveDraft' | translate }}
      </button>
    </div>

  </div>
</div>
