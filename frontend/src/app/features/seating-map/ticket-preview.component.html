<div class="ticket-preview-page">
  <!-- Header / Back Action -->
  <header class="preview-header">
    <button type="button" class="back-btn" (click)="goBack()" aria-label="Go back">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="text-headline-md">Ticket Preview</h1>
  </header>

  @if (isLoading()) {
    <div class="card loading-state">
      <p>Loading ticket details...</p>
    </div>
  } @else {
    @if (ticket(); as details) {
      <!-- The Ticket Card (rendered from the event's chosen template) -->
      <div #ticketEl class="ticket-render-wrap">
        <app-ticket-template-host
          [templateId]="(details.reservation_type === 'COUPLE' ? details.ticket_template_couple : details.ticket_template_single) || 'classic'"
          [details]="details"
          [customTemplates]="customTemplates()"
        />
      </div>

      <!-- Actions -->
      <div class="action-buttons">
        <button type="button" class="btn btn-primary download-btn" (click)="downloadPdf()" [disabled]="isDownloading()">
          <span class="material-symbols-outlined">download</span>
          {{ isDownloading() ? 'Downloading...' : 'Download PDF' }}
        </button>

        @if (details.status !== 'CANCELLED') {
          <button type="button" class="btn btn-danger cancel-btn" (click)="cancelTicket()">
            <span class="material-symbols-outlined">cancel</span>
            Cancel Reservation
          </button>
        }
      </div>
    } @else {
      <div class="card error-state">
        <p>No ticket details found.</p>
        <button type="button" class="btn btn-secondary" (click)="goBack()">Go Back</button>
      </div>
    }
  }

  <app-confirmation-dialog
    [open]="showCancelConfirmation()"
    [title]="i18n.t('guestList.confirmCancelTitle') || 'Confirm cancellation'"
    [message]="i18n.t('guestList.confirmCancel', { name: ticket()?.invitee_name }) || ('Cancel reservation for ' + ticket()?.invitee_name + '?')"
    [confirmLabel]="i18n.t('guestList.cancel') || 'Cancel'"
    [cancelLabel]="i18n.t('common.cancel') || 'Close'"
    confirmButtonClass="btn-danger"
    [showCancel]="false"
    (confirm)="confirmCancelTicket()"
    (cancel)="closeCancelTicketConfirmation()"
  ></app-confirmation-dialog>
</div>
